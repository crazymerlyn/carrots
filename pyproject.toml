[project]
name = "carrots-game"
version = "1.0.0"
description = "A multiplayer card game"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2,<7.0",
    "psycopg2-binary>=2.9,<3.0",
    "dj-database-url>=2.0,<3.0",
    "whitenoise>=6.0,<7.0",
]

[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput"
